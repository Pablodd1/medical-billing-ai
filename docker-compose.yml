version: '3.8'

services:
  medical-billing-api:
    build: .
    container_name: medical_billing_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SUBMITTER_ID=MAGNOLIA_HEALTH
      - OFFICE_ALLY_SFTP_HOST=sftp.officeally.com
      - PORT=8000
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
